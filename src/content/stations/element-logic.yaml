role:
  en: "Software Engineer"
  de: "Softwareentwickler"
area:
  en: "R&D, intralogistics"
  de: "R&D, Intralogistik"
gist:
  en: "Backend development in research and development, in a team that builds standard building blocks for linking external systems and parts of the company's new software platform. Test-driven, often in pair programming, and in English with the partner teams in Norway. Also support and on-call duty."
  de: "Backend-Entwicklung im Bereich Research & Development, in einem Team, das Standardbausteine für die Anbindung von Fremdsystemen und Teile der neuen Software-Plattform des Unternehmens baut. Testgetrieben, oft im Pair Programming, und mit den Partnerteams in Norwegen auf Englisch. Dazu Support und Rufbereitschaft."
work:
  - title:
      en: "Connecting automated storage systems"
      de: "Anbindung automatischer Lagersysteme"
    text:
      en: "Maintaining and extending the central service between automated storage systems and the warehouse management system, and modernising it while in production."
      de: "Pflege und Ausbau des zentralen Service zwischen automatischen Lagersystemen und dem Lagerverwaltungssystem sowie seine Modernisierung im laufenden Betrieb."
  - title:
      en: "A gateway for the new platform"
      de: "Ein Gateway für die neue Plattform"
    text:
      en: "Design and development of the gateway that connects automated storage systems to the new platform, including a simulation, with shared responsibility for its engineering and API."
      de: "Entwurf und Entwicklung des Gateways, über das automatische Lagersysteme an die neue Plattform angeschlossen werden, samt Simulation; mitverantwortlich für Engineering und API."
  - title:
      en: "Standard components for host systems"
      de: "Standardkomponenten für Host-Systeme"
    text:
      en: "Developing the standard components that connect customers' host systems, including a rewrite of the host interface service in Kotlin."
      de: "Entwicklung der Standardkomponenten, über die Host-Systeme von Kunden angebunden werden, darunter ein Rewrite des Host-Interface-Service in Kotlin."
  - title:
      en: "Customer projects in the early phase"
      de: "Kundenprojekte in der Anfangszeit"
    text:
      en: "Customer-specific interfaces such as pick-by-light and host connections, database migrations across major versions, and go-lives on site."
      de: "Kundenspezifische Schnittstellen wie Pick-by-Light und Host-Anbindungen, Datenbankmigrationen über mehrere Hauptversionen hinweg und Go-lives vor Ort."
