role:
  en: "Work-study student, Mechatronics"
  de: "Dualer Student Mechatronik"
area:
  en: "Industrial communication"
  de: "Industrielle Kommunikation"
edu:
  en: "B.Eng. Mechatronics, DHBW Stuttgart, 2018"
  de: "B.Eng. Mechatronik, DHBW Stuttgart, 2018"
gist:
  en: "Company phases of the work-study degree programme, after foundation training in the workshop and in control engineering: industrial communication, augmented reality and three months on a plant construction site."
  de: "Praxisphasen des dualen Studiums nach einer Grundausbildung in Werkstatt und Steuerungstechnik: industrielle Kommunikation, Augmented Reality und drei Monate auf einer Anlagenbaustelle."
work:
  - title:
      en: "Industrial communication"
      de: "Industrielle Kommunikation"
    text:
      en: "Investigating the communication between programmable logic controllers and software, with performance measurements of OPC UA connections."
      de: "Untersuchung der Kommunikation zwischen speicherprogrammierbaren Steuerungen und Software, mit Performancemessungen von OPC-UA-Verbindungen."
  - title:
      en: "Augmented reality"
      de: "Augmented Reality"
    text:
      en: "First steps with augmented reality: a feasibility study for a demonstrator, and building on it my bachelor thesis. On my own, I developed a HoloLens mixed reality application in C# with Unity that places CAD models from the design department true to scale and positioned as exactly as possible in the real plant, so that dimensioning errors show up before a part is installed. For this, I worked out toolsets to use the various CAD file formats that design produces anyway."
      de: "Erste Schritte mit Augmented Reality: eine Machbarkeitsuntersuchung für einen Demonstrator und darauf aufbauend meine Bachelorarbeit. Darin habe ich eigenständig eine HoloLens-Mixed-Reality-Anwendung in C# mit Unity entwickelt, die CAD-Modelle aus der Konstruktion maßstabsgetreu und möglichst exakt positioniert in der realen Anlage einblendet, damit Dimensionierungsfehler auffallen, bevor ein Teil eingebaut wird. Dafür habe ich Toolsets erarbeitet, um die verschiedenen CAD-Dateiformate zu nutzen, die in der Konstruktion ohnehin anfallen."
  - title:
      en: "Commissioning in the USA"
      de: "Inbetriebnahme in den USA"
    text:
      en: "Three months at an automotive manufacturer's plant, where Dürr Systems sent me as part of the dual study: hands-on work setting up robot lines and their electrical installation."
      de: "Drei Monate im Werk eines Automobilherstellers, wohin mich Dürr Systems im Rahmen des dualen Studiums entsandt hat: praktische Mitarbeit beim Aufbau von Roboterlinien und ihrer Elektroinstallation."
